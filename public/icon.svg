<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Star of 8 Points (Rub el Hizb) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)" stroke="url(#goldGrad)" stroke-width="8" fill="none">
    <rect x="128" y="128" width="256" height="256" rx="24"/>
    <rect x="128" y="128" width="256" height="256" rx="24" transform="rotate(45 256 256)"/>
  </g>

  <!-- Islamic Dome Arch & Open Quran Motif -->
  <path d="M 256,120 C 275,180 340,210 340,290 C 340,360 256,360 256,360 C 256,360 172,360 172,290 C 172,210 237,180 256,120 Z" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>

  <!-- Open Quran Book Pages -->
  <path d="M 180,330 Q 256,350 256,375 Q 256,350 332,330 C 320,385 270,395 256,395 C 242,395 192,385 180,330 Z" fill="url(#goldGrad)"/>

  <!-- Crescent & Star -->
  <circle cx="256" cy="190" r="14" fill="url(#goldGrad)"/>
</svg>
